# Proxy settings shared by the szigzug.hu locations.
# Install as /etc/nginx/snippets/szigzug-proxy.conf

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# $remote_addr, not $proxy_add_x_forwarded_for: a client must not be able to send
# a fake address (the app uses it for login throttling and the event log).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 30s;
