# szigzug.hu: final nginx config (HTTPS). Install as /etc/nginx/sites-available/szigzug.hu
# and link it into sites-enabled (deploy/README.md, step 5).

# Login page requests per client IP address. Generous, because a whole school
# Wi-Fi can share one address; the app has its own per-user lockout as well.
limit_req_zone $binary_remote_addr zone=szigzug_login:10m rate=30r/m;

upstream szigzug_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Plain HTTP: only Let's Encrypt renewals; everything else is sent to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name szigzug.hu www.szigzug.hu;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://szigzug.hu$request_uri;
    }
}

# https://www.szigzug.hu → https://szigzug.hu (one address, so cookies and logins behave).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.szigzug.hu;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/szigzug.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szigzug.hu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://szigzug.hu$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2 (optional): on Debian 13 (nginx 1.26) add the line "http2 on;".
    # On Debian 12 (nginx 1.22) instead write "listen 443 ssl http2;" in both listen lines.
    server_name szigzug.hu;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/szigzug.hu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/szigzug.hu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:szigzug_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Browsers remember to use HTTPS only. Starts at one day; once everything
    # has worked for a week, raise it to 31536000 (one year) and reload nginx.
    add_header Strict-Transport-Security "max-age=86400" always;

    client_max_body_size 64k;

    # The few static files are served by nginx directly.
    location /static/ {
        alias /opt/szigzug/public/;
        expires 1h;
        access_log off;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /admin/login {
        limit_req zone=szigzug_login burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://szigzug_app;
        include /etc/nginx/snippets/szigzug-proxy.conf;
    }

    location / {
        proxy_pass http://szigzug_app;
        include /etc/nginx/snippets/szigzug-proxy.conf;
    }
}
