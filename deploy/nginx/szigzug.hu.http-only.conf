# STEP 1 config: plain HTTP, used only until the first HTTPS certificate exists.
# Serves Let's Encrypt's challenge files and forwards everything else to the app.
# Replace it with szigzug.hu.conf as soon as the certificate is issued (deploy/README.md, step 5).

server {
    listen 80;
    listen [::]:80;
    server_name szigzug.hu www.szigzug.hu;

    server_tokens off;
    client_max_body_size 64k;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
